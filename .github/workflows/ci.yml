name: CI

on:
  pull_request:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Build and test (Ubuntu, Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      # Serialize cache misses so later Python versions can reuse native builds.
      max-parallel: 1
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    env:
      PIXELPIPES_DEPENDENCY_ROOT: ${{ github.workspace }}/build/test-dependencies
      BUILD_ROOT: ${{ github.workspace }}/build/test-python-${{ matrix.python-version }}
      BUILD_WORKERS: 2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Record native toolchain
        id: toolchain
        run: |
          echo "compiler=$(g++ -dumpfullversion -dumpversion)" >> "$GITHUB_OUTPUT"
          echo "cmake=$(cmake --version | awk 'NR == 1 { print $3 }')" >> "$GITHUB_OUTPUT"

      - name: Restore OpenCV dependency
        uses: actions/cache@v5
        with:
          path: |
            build/test-dependencies/build/opencv
            build/test-dependencies/installed/opencv
          key: native-test-opencv-${{ runner.os }}-${{ runner.arch }}-gcc-${{ steps.toolchain.outputs.compiler }}-cmake-${{ steps.toolchain.outputs.cmake }}-${{ hashFiles('cmake/dependency-versions.cmake', 'cmake/opencv.cmake') }}-v3

      - name: Restore TurboJPEG dependency
        uses: actions/cache@v5
        with:
          path: |
            build/test-dependencies/build/turbojpeg
            build/test-dependencies/installed/turbojpeg
          key: native-test-turbojpeg-${{ runner.os }}-${{ runner.arch }}-gcc-${{ steps.toolchain.outputs.compiler }}-cmake-${{ steps.toolchain.outputs.cmake }}-${{ hashFiles('cmake/dependency-versions.cmake', 'cmake/turbojpeg.cmake') }}-v1

      - name: Restore zlib dependency
        uses: actions/cache@v5
        with:
          path: |
            build/test-dependencies/build/zlib
            build/test-dependencies/installed/zlib
          key: native-test-zlib-${{ runner.os }}-${{ runner.arch }}-gcc-${{ steps.toolchain.outputs.compiler }}-cmake-${{ steps.toolchain.outputs.cmake }}-${{ hashFiles('cmake/dependency-versions.cmake', 'cmake/zlib.cmake') }}-v2

      - name: Restore xtensor dependencies
        uses: actions/cache@v5
        with:
          path: |
            build/test-dependencies/build/xtl
            build/test-dependencies/build/xsimd
            build/test-dependencies/build/xtensor
            build/test-dependencies/installed/xtensor
          key: native-test-xtensor-${{ runner.os }}-${{ runner.arch }}-gcc-${{ steps.toolchain.outputs.compiler }}-cmake-${{ steps.toolchain.outputs.cmake }}-${{ hashFiles('cmake/dependency-versions.cmake', 'cmake/xtensor.cmake') }}-v2

      - name: Restore FetchContent sources
        uses: actions/cache@v5
        with:
          path: |
            build/test-dependencies/sources/lodepng-src
            build/test-dependencies/sources/hashlib-src
          key: native-test-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/dependency-versions.cmake', 'cmake/lodepng.cmake', 'cmake/hashlib.cmake') }}-v2

      - name: Install Python build and runtime requirements
        run: python -m pip install setuptools "cmake>=3.15,<4" "pybind11>=2.12" "numpy>=2" "bidict>=0.21" "attributee>=0.1.11"

      - name: Build native libraries
        run: python setup.py build_lib --inplace

      - name: Run tests
        run: python -m unittest discover -s tests -t . -p 'test_*.py' -v

      - name: Run C++ tests
        run: ctest --test-dir "$BUILD_ROOT" --output-on-failure

  manylinux-dependencies:
    name: Prepare manylinux2014 x86_64 dependencies
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    env:
      MANYLINUX_IMAGE: quay.io/pypa/manylinux2014_x86_64
      DEPENDENCY_ROOT: ${{ github.workspace }}/build_wheel/dependencies
      BUILD_WORKERS: 4
    steps:
      - uses: actions/checkout@v7

      - name: Pull manylinux image
        id: image
        run: |
          docker pull "$MANYLINUX_IMAGE"
          image_id=$(docker image inspect --format '{{.Id}}' "$MANYLINUX_IMAGE")
          image_id=${image_id#sha256:}
          echo "id=${image_id}" >> "$GITHUB_OUTPUT"

      - name: Restore OpenCV dependency
        uses: actions/cache@v5
        with:
          path: |
            build_wheel/dependencies/build/opencv
            build_wheel/dependencies/installed/opencv
          key: native-manylinux2014-x86_64-opencv-${{ steps.image.outputs.id }}-${{ hashFiles('cmake/dependency-versions.cmake', 'cmake/opencv.cmake') }}-v3

      - name: Restore TurboJPEG dependency
        uses: actions/cache@v5
        with:
          path: |
            build_wheel/dependencies/build/turbojpeg
            build_wheel/dependencies/installed/turbojpeg
          key: native-manylinux2014-x86_64-turbojpeg-${{ steps.image.outputs.id }}-${{ hashFiles('cmake/dependency-versions.cmake', 'cmake/turbojpeg.cmake') }}-v1

      - name: Restore zlib dependency
        uses: actions/cache@v5
        with:
          path: |
            build_wheel/dependencies/build/zlib
            build_wheel/dependencies/installed/zlib
          key: native-manylinux2014-x86_64-zlib-${{ steps.image.outputs.id }}-${{ hashFiles('cmake/dependency-versions.cmake', 'cmake/zlib.cmake') }}-v2

      - name: Restore xtensor dependencies
        uses: actions/cache@v5
        with:
          path: |
            build_wheel/dependencies/build/xtl
            build_wheel/dependencies/build/xsimd
            build_wheel/dependencies/build/xtensor
            build_wheel/dependencies/installed/xtensor
          key: native-manylinux2014-x86_64-xtensor-${{ steps.image.outputs.id }}-${{ hashFiles('cmake/dependency-versions.cmake', 'cmake/xtensor.cmake') }}-v2

      - name: Restore FetchContent sources
        uses: actions/cache@v5
        with:
          path: |
            build_wheel/dependencies/sources/lodepng-src
            build_wheel/dependencies/sources/hashlib-src
          key: native-manylinux2014-x86_64-sources-${{ steps.image.outputs.id }}-${{ hashFiles('cmake/dependency-versions.cmake', 'cmake/lodepng.cmake', 'cmake/hashlib.cmake') }}-v2

      - name: Build or reuse pinned native dependencies
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/io" -w /io \
            -e PIXELPIPES_DEPENDENCY_ROOT=/io/build_wheel/dependencies \
            -e BUILD_WORKERS="$BUILD_WORKERS" \
            "$MANYLINUX_IMAGE" bash /io/scripts/build_native_dependencies.sh

      - name: Archive installed native dependencies
        run: tar -C build_wheel/dependencies -czf build_wheel/native-dependencies.tar.gz installed

      - name: Share native dependencies with wheel jobs
        uses: actions/upload-artifact@v7
        with:
          name: pixelpipes-manylinux2014-x86_64-native-dependencies
          path: build_wheel/native-dependencies.tar.gz
          compression-level: 0
          if-no-files-found: error

  manylinux-wheels:
    name: Build and smoke-test ${{ matrix.pydist }} manylinux2014 x86_64 wheel
    needs: manylinux-dependencies
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        pydist:
          - cp39-cp39
          - cp310-cp310
          - cp311-cp311
          - cp312-cp312
    runs-on: ubuntu-22.04
    env:
      MANYLINUX_IMAGE: quay.io/pypa/manylinux2014_x86_64
      WHEEL_ROOT: ${{ github.workspace }}/build_wheel/dist
      BUILD_ROOT: ${{ github.workspace }}/build_wheel/build
      BUILD_WORKERS: 4
      PYDIST_FILTER: ${{ matrix.pydist }}
    steps:
      - uses: actions/checkout@v7

      - name: Download prepared native dependencies
        uses: actions/download-artifact@v7
        with:
          name: pixelpipes-manylinux2014-x86_64-native-dependencies
          path: build_wheel

      - name: Extract prepared native dependencies
        run: |
          mkdir -p build_wheel/dependencies
          tar -xzf build_wheel/native-dependencies.tar.gz -C build_wheel/dependencies

      - name: Build and smoke-test repaired wheel
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/io" -w /io \
            -e PYDIST_FILTER="$PYDIST_FILTER" \
            -e WHEEL_ROOT=/io/build_wheel/dist \
            -e BUILD_ROOT=/io/build_wheel/build \
            -e PIXELPIPES_DEPENDENCY_ROOT=/io/build_wheel/dependencies \
            -e BUILD_WORKERS="$BUILD_WORKERS" \
            "$MANYLINUX_IMAGE" bash /io/scripts/build_manylinux.sh

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: pixelpipes-manylinux2014-x86_64-${{ matrix.pydist }}
          path: build_wheel/dist/*.whl
          if-no-files-found: error

  sdist:
    name: Build source distribution
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade setuptools
          python setup.py sdist --dist-dir build_wheel/dist

      - name: Upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: pixelpipes-sdist
          path: build_wheel/dist/*.tar.gz
          if-no-files-found: error
